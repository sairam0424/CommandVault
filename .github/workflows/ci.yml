name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Format check
        run: pnpm format:check

  cross-platform:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  package-vscode:
    name: Package VS Code Extension
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package VSIX
        run: pnpm --filter commandvault-ai run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: commandvault-vsix
          path: packages/vscode/*.vsix

  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      # No `cache: pnpm` here: nothing is installed in this job, so there is no pnpm store to
      # save, and setup-node's post step fails the whole job with "Path Validation Error".
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # Reads pnpm-lock.yaml directly, no install needed. Gated at `high` on what ships to users.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      # Report only, on purpose and for now. Advisories published on 2026-10-05 for tinypool (critical),
      # source-map-js (high) and vitest / @vitest/mocker (moderate) sit in the development test toolchain, never
      # ship to users, and are fixed only by the vitest 4 upgrade, which is tracked. Until it lands this step
      # warns instead of failing every pull request; the upgrade turns it back into a blocking gate.
      - name: Report development dependency advisories
        run: >-
          pnpm audit --audit-level high ||
          echo "::warning title=Development dependency advisories::pnpm audit reports high or critical advisories in the development toolchain. Tracked for the vitest 4 upgrade."

  # The one check a ruleset can require. Matrix jobs produce per-leg check names and nothing
  # aggregated them, so pull requests merged while `Test (windows-latest)` was red. This job runs
  # even when a needed job fails or is skipped (`if: always()`) and is green only when every one
  # of them reports `success`; `failure`, `cancelled` and `skipped` all turn it red.
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    permissions: {}
    if: always()
    needs: [build-and-test, cross-platform, package-vscode, dependency-audit]

    steps:
      - name: Require every needed job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          if jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null; then
            echo "CI gate: every needed job succeeded."
          else
            echo "::error title=CI gate::at least one needed job did not succeed (failure, cancelled or skipped)."
            jq . <<< "$NEEDS"
            exit 1
          fi

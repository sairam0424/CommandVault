name: Bundle Size Check

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'packages/*/src/**'
      - 'packages/*/package.json'
      - 'pnpm-lock.yaml'

permissions:
  pull-requests: write
  contents: read

jobs:
  size:
    name: Check Bundle Size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Measure bundle sizes
        id: size
        run: |
          VSCODE_SIZE=$(stat -f%z packages/vscode/dist/extension.js 2>/dev/null || stat -c%s packages/vscode/dist/extension.js)
          CORE_SIZE=$(find packages/core/dist -name '*.js' -exec cat {} + | wc -c)
          CLI_SIZE=$(find packages/cli/dist -name '*.js' -exec cat {} + | wc -c)

          echo "vscode=$VSCODE_SIZE" >> $GITHUB_OUTPUT
          echo "core=$CORE_SIZE" >> $GITHUB_OUTPUT
          echo "cli=$CLI_SIZE" >> $GITHUB_OUTPUT

          echo "### Bundle Sizes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| VS Code extension | $(echo $VSCODE_SIZE | numfmt --to=iec-i 2>/dev/null || echo "${VSCODE_SIZE} bytes") |" >> $GITHUB_STEP_SUMMARY
          echo "| Core | $(echo $CORE_SIZE | numfmt --to=iec-i 2>/dev/null || echo "${CORE_SIZE} bytes") |" >> $GITHUB_STEP_SUMMARY
          echo "| CLI | $(echo $CLI_SIZE | numfmt --to=iec-i 2>/dev/null || echo "${CLI_SIZE} bytes") |" >> $GITHUB_STEP_SUMMARY

      - name: Comment PR with sizes
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: bundle-size
          message: |
            ## 📦 Bundle Sizes
            | Package | Size |
            |---------|------|
            | VS Code extension | ${{ steps.size.outputs.vscode }} bytes |
            | Core | ${{ steps.size.outputs.core }} bytes |
            | CLI | ${{ steps.size.outputs.cli }} bytes |

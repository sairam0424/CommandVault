name: Test Coverage

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Core tests with coverage
        run: pnpm --filter @commandvault/core test -- --coverage
        continue-on-error: true

      - name: CLI tests with coverage
        run: pnpm --filter @commandvault/cli test -- --coverage
        continue-on-error: true

      - name: VS Code tests with coverage
        run: pnpm --filter commandvault-ai test -- --coverage
        continue-on-error: true

      - name: Core coverage report
        if: always()
        uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2
        with:
          name: 'Core'
          json-summary-path: ./packages/core/coverage/coverage-summary.json
          json-final-path: ./packages/core/coverage/coverage-final.json
        continue-on-error: true

      - name: CLI coverage report
        if: always()
        uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2
        with:
          name: 'CLI'
          json-summary-path: ./packages/cli/coverage/coverage-summary.json
          json-final-path: ./packages/cli/coverage/coverage-final.json
        continue-on-error: true

      - name: VS Code coverage report
        if: always()
        uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2
        with:
          name: 'VS Code'
          json-summary-path: ./packages/vscode/coverage/coverage-summary.json
          json-final-path: ./packages/vscode/coverage/coverage-final.json
        continue-on-error: true

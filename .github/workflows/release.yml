name: Release (Manual)

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Perform a dry run without publishing'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build, Test & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Validate secrets
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not configured"
            exit 1
          fi
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT secret is not configured"
            exit 1
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test core
        run: pnpm --filter @commandvault/core test

      - name: Typecheck
        run: pnpm typecheck

      - name: Get package versions
        id: pkg_versions
        run: |
          echo "core=$(node -p "require('./packages/core/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "cli=$(node -p "require('./packages/cli/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "vscode=$(node -p "require('./packages/vscode/package.json').version")" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------------------
      # IDEMPOTENCY GUARD
      # This manual workflow is a break-glass duplicate of release-please's
      # automatic publish path. If release-please already shipped this exact
      # version, each check below detects that and the corresponding publish
      # step is SKIPPED (not failed). Each check fails OPEN: if the lookup
      # itself can't be completed (network hiccup, unexpected API response),
      # we proceed to attempt the publish, which is the pre-existing
      # behavior of this workflow.
      # --------------------------------------------------------------------

      - name: Check if @commandvault/core is already published
        id: check_core
        run: |
          if npm view "@commandvault/core@${{ steps.pkg_versions.outputs.core }}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish @commandvault/core to npm
        if: steps.check_core.outputs.already_published == 'false'
        run: pnpm --filter @commandvault/core publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check if @commandvault/cli is already published
        id: check_cli
        run: |
          if npm view "@commandvault/cli@${{ steps.pkg_versions.outputs.cli }}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish @commandvault/cli to npm
        if: steps.check_cli.outputs.already_published == 'false'
        run: pnpm --filter @commandvault/cli publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Package VS Code extension
        run: pnpm --filter commandvault-ai run package

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: packages/vscode/*.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Best-effort idempotency check against the public, unauthenticated
      # Marketplace Gallery query API (no VSCE_PAT needed for reads;
      # filterType 7 = query by extension unique name). If this lookup
      # fails or returns nothing, published_version stays empty and the
      # publish step below runs anyway — fail-open, same as the npm checks.
      - name: Check if VS Code Marketplace version already published
        id: check_vsce
        run: |
          set +e
          PUBLISHED_VERSION=$(curl -s -X POST "https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json;api-version=3.0-preview.1" \
            -d '{"filters":[{"criteria":[{"filterType":7,"value":"nothumanslabs.commandvault-ai"}]}],"flags":914}' \
            | jq -r '.results[0].extensions[0].versions[0].version // ""' 2>/dev/null)
          set -e
          echo "published_version=${PUBLISHED_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Marketplace latest published version (best-effort lookup): ${PUBLISHED_VERSION:-unknown}"

      - name: Publish VS Code extension
        if: steps.check_vsce.outputs.published_version != steps.pkg_versions.outputs.vscode
        run: npx @vscode/vsce publish --packagePath packages/vscode/*.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
